name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs: build reads the code, deploy publishes.
# Actions are pinned to commit SHAs (the tag in the comment).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Lint, types, unit tests, build and link check. The browser checks run in CI.
      - run: npm run check:fast
      - name: Check the App Links file is in the site
        run: test -s out/.well-known/assetlinks.json && cmp out/.well-known/assetlinks.json public/.well-known/assetlinks.json
      - name: Check security.txt is in the site and not expired
        run: |
          cmp out/.well-known/security.txt public/.well-known/security.txt
          expires=$(sed -n 's/^Expires: //p' out/.well-known/security.txt)
          test "$(date -u -d "$expires" +%s)" -gt "$(date -u +%s)"
      # v3 keeps dotfiles, so .well-known/assetlinks.json is published.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
