name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Lint, types, unit tests, build (with the CSP step), link check, Playwright + axe on
      # every page at 360/768/1280 px in light and dark, and Lighthouse on home, privacy and /p/.
      - run: npm run check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            lighthouse/
